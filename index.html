<!DOCTYPE html>
<html>
<head>
  <title>Camera Share Demo</title>
</head>
<body>

<h2>Consent Camera Demo</h2>

<p id="myId">Connecting...</p>

<button id="shareBtn">Share My Camera</button>

<br><br>

<video id="localVideo" autoplay muted playsinline width="400"></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
const peer = new Peer();

let myId;
let localStream;

peer.on("open", id => {
    myId = id;
    document.getElementById("myId").innerText =
        "Your ID: " + id;
});

document.getElementById("shareBtn").onclick = async () => {

    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
    });

    document.getElementById("localVideo").srcObject = localStream;

    const otherId = prompt("Enter the viewer's Peer ID:");

    if (otherId) {
        const call = peer.call(otherId, localStream);
    }
};

peer.on("call", call => {

    if (!localStream) {
        alert("Camera sharing has not been started.");
        return;
    }

    call.answer(localStream);

    call.on("stream", remoteStream => {
        let video = document.getElementById("remoteVideo");

        if (!video) {
            video = document.createElement("video");
            video.id = "remoteVideo";
            video.autoplay = true;
            video.playsInline = true;
            video.width = 500;
            document.body.appendChild(video);
        }

        video.srcObject = remoteStream;
    });
});
</script>

</body>
</html>
