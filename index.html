<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Share Demo</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 90%;
      max-width: 600px;
      margin: 10px;
      background: #111;
      border-radius: 12px;
    }

    button, input {
      padding: 12px;
      margin: 6px;
      font-size: 16px;
    }

    #myId {
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>📹 Camera Share Demo</h2>

  <p>
    Your Peer ID:
    <br>
    <span id="myId">Connecting...</span>
  </p>

  <button onclick="shareCamera()">Share My Camera</button>

  <hr>

  <h3>Remote Camera</h3>
  <video id="remoteVideo" autoplay playsinline controls></video>

  <script>
    const peer = new Peer();

    peer.on('open', function(id) {
      document.getElementById('myId').textContent = id;
    });

    peer.on('call', function(call) {
      const answer = confirm(
        "Someone wants to receive your camera. Accept?"
      );

      if (!answer) {
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      })
      .then(function(stream) {
        call.answer(stream);
      })
      .catch(function(error) {
        alert("Camera permission required.");
        console.error(error);
      });
    });

    peer.on('error', function(error) {
      console.error(error);
      alert("PeerJS error: " + error.type);
    });

    function shareCamera() {
      const viewerId = prompt(
        "Enter the Peer ID of the person who should receive your camera:"
      );

      if (!viewerId) return;

      navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      })
      .then(function(stream) {

        const call = peer.call(viewerId, stream);

        call.on('stream', function(remoteStream) {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });

      })
      .catch(function(error) {
        alert("Camera permission required.");
        console.error(error);
      });
    }
  </script>

</body>
</html>
